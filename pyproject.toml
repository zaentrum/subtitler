[project]
name = "subtitler"
version = "0.2.0"
description = "Subtitles in an instance's languages for every title (ADR-0014): speech recognition and translation with open-weight models"
readme = "README.md"
license = "MPL-2.0"
requires-python = ">=3.10"
dependencies = ["opencc>=1.1"]

[project.optional-dependencies]
# Speech recognition: faster-whisper on CTranslate2 (CPU, CUDA).
asr = ["faster-whisper>=1.1", "numpy"]
# Speech recognition on Apple's Metal GPU (macOS only).
mlx = ["mlx-whisper>=0.4"]
# The dedicated translation model (MADLAD-400 on CTranslate2).
mt = ["ctranslate2>=4.5", "sentencepiece"]
# Chinese line breaks between words (MIT).
zh = ["jieba>=0.42"]
# Scores of the bench.
eval = ["jiwer>=3", "sacrebleu>=2.4", "whisper-normalizer"]
comet = ["unbabel-comet>=2.2"]
dev = ["pytest"]

[project.scripts]
subtitler = "subtitler.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
